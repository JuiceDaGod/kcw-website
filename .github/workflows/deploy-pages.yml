name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode site images if needed
        run: |
          set -euo pipefail
          if [ -d _payload ]; then
            cat _payload/assets.tar.b64.* | base64 -d > /tmp/assets.tar
            tar -xf /tmp/assets.tar
            rm -rf _payload /tmp/assets.tar
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Add official KCW site images"
              git push
            fi
          fi
          test -f assets/img/kcw-logo.png
          test -f assets/roster/vertabreaker.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
