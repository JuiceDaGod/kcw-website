name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode site images if needed
        run: |
          set -euo pipefail
          if [ -d _payload ]; then
            cat _payload/assets.tar.b64.* | base64 -d > /tmp/assets.tar
            tar -xf /tmp/assets.tar
            rm -rf _payload /tmp/assets.tar
          fi
          rm -rf assets/source
          test -f assets/img/kcw-logo.webp
          test -f assets/img/official-merch.jpg
          test -f assets/merch/brian-cross-tee.jpg
          test -f assets/roster/vertabreaker.jpg
          test -f merch.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact registration
        run: sleep 25
      - uses: actions/deploy-pages@v4
        id: deployment
